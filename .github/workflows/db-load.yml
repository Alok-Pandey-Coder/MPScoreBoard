# Loads each approved snapshot into YugabyteDB after it is merged to main.
#
# Runs only when data/processed changes on main (i.e. after a reviewed data
# refresh PR is merged). scripts/load_db.py is idempotent: an already-loaded
# snapshot is skipped, and every load is one transaction.
#
# Requires the repository secret DATABASE_URL (YugabyteDB Aeon connection
# string), in the form
#   postgresql://<user>:<password>@<host>:5433/yugabyte?sslmode=verify-full&sslrootcert=certs/root.crt
# The certificate is not in the repository (certs/ is git-ignored). Add its text as the repository
# secret DATABASE_CA_CERT; the job writes it to certs/root.crt before loading.
# Do not add ssl=true: the Python driver (libpq) rejects it. The Aeon IP allow list must allow
# GitHub's runners (no fixed IPs, so 0.0.0.0/0). Without the secret the job is skipped and
# the site keeps serving the JSON snapshot.

name: Load snapshot into YugabyteDB

on:
  push:
    branches: [main]
    paths:
      - 'data/processed/mps.json'
      - 'data/processed/snapshot.json'
  workflow_dispatch: {}

concurrency:
  group: db-load
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.DATABASE_URL != ''

      - name: Write the CA certificate
        if: env.DATABASE_URL != ''
        env:
          CA_CERT: ${{ secrets.DATABASE_CA_CERT }}
        run: |
          mkdir -p certs
          printf '%s\n' "$CA_CERT" > certs/root.crt

      - uses: actions/setup-python@v5
        if: env.DATABASE_URL != ''
        with:
          python-version: '3.12'

      - name: Validate and load the approved snapshot
        if: env.DATABASE_URL != ''
        run: |
          pip install -r requirements.txt
          python -m pytest tests -q
          python scripts/load_db.py --schema
